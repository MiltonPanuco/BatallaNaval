<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla Naval - CH8</title>

    <link rel="icon" type="image/x-icon" href="resources/images/logo.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/configuracion.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="configuracion">


        <div id="pantallaConfiguracion">
            <a href="index.html"><button class="btn-regresar">Regresar</button></a>

            <div class="contenedor-config">
                <h1>CONFIGURACIÓN DEL JUEGO</h1>

                <!-- Tamaño del tablero -->
                <div class="config-grupo">
                    <label>Tamaño del Tablero</label>
                    <div class="selector-tablero">
                        <button class="btn-tablero">6x6</button>
                        <button class="btn-tablero activo">8x8</button>
                        <button class="btn-tablero">10x10</button>
                    </div>
                </div>

                <!-- Límite de barcos -->
                <div class="config-grupo">
                    <label>Barcos por Jugador</label>
                    <input type="number" id="limiteBarcos" value="5" min="1" max="8" class="input-config">
                </div>

                <!-- Jugadores -->
                <div class="config-grupo">
                    <label>Selecciona 2 Jugadores (1 vs 1)</label>
                    <div id="listaJugadores"></div>
                </div>

                <!-- Opciones de Audio -->
                <div class="config-grupo">
                    <label>Opciones de Audio</label>
                    <div class="opciones-audio">
                        <div class="opcion-audio">
                            <label>Música</label>
                            <div class="toggle-container">
                                <input type="checkbox" id="toggleMusica" checked>
                                <label for="toggleMusica" class="toggle-label">
                                    <span class="toggle-button"></span>
                                </label>
                            </div>
                        </div>
                        <div class="opcion-audio">
                            <label>Narrador</label>
                            <div class="toggle-container">
                                <input type="checkbox" id="toggleNarrador" checked>
                                <label for="toggleNarrador" class="toggle-label">
                                    <span class="toggle-button"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn-config-listo" disabled>
                    INICIAR PARTIDA
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/configuracion.js"></script>
</body>

</html>
